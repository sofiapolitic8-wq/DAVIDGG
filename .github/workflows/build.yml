name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Guarantees the debug keystore exists (the release APK is signed with it unless you add your own key).
      - name: Ensure debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Optional: sign the release APK with your own key.
      # Add repository secrets RSHMAP_KEYSTORE_BASE64 (base64 of the .jks), RSHMAP_KEYSTORE_PASSWORD,
      # RSHMAP_KEY_ALIAS and RSHMAP_KEY_PASSWORD. Without them (forks, PRs) the debug key is used.
      - name: Decode release keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.RSHMAP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RSHMAP_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      # The APK is built FIRST so a test / lint hiccup can never block it.
      - name: Assemble debug + release APK
        env:
          RSHMAP_KEYSTORE_PASSWORD: ${{ secrets.RSHMAP_KEYSTORE_PASSWORD }}
          RSHMAP_KEY_ALIAS: ${{ secrets.RSHMAP_KEY_ALIAS }}
          RSHMAP_KEY_PASSWORD: ${{ secrets.RSHMAP_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/RSHMap-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/RSHMap-release.apk
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: RSHMap-apks
          path: dist/*.apk

      - name: Unit tests (core engine)
        continue-on-error: true
        run: ./gradlew :core:test --stacktrace

      - name: Lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            core/build/reports/tests
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: RSHMap-apks
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RSHMap-release.apk
            dist/RSHMap-debug.apk
          generate_release_notes: true
